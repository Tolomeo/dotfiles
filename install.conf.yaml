- defaults:
    link:
      relink: true
    shell:
      stdin: true
      stdout: true
      stderr: true

- clean: ["~"]

- create:
    - ~/.config

- link:
    ~/.dotfiles: ""
    ~/.zshrc: resources/zsh/.zshrc
    ~/.zshenv: resources/zsh/.zshenv
    ~/.config/nvim: resources/nvim
    ~/.config/lf: resources/lf
    ~/.config/kitty: resources/kitty

- shell:
    - description: Installing submodules
      command: git submodule update --init --recursive

- ifmacos:
  - shell:
        - description: Installing Xcode command line tools
          command: setup/xcode-select.sh
          stdin: true
          stdout: true
          stderr: true
- ifubuntu:
    - shell:
        - description: Installing apt dependencies
          command: setup/apt.sh
          stdin: true
          stdout: true
          stderr: true
- iffedora:
    - shell:
        - description: Installing dnf dependencies
          command: setup/dnf.sh
          stdin: true
          stdout: true
          stderr: true

- shell:
    - description: Setting up homebrew
      command: setup/homebrew.sh
    - description: Setting up zsh
      command: setup/zsh.sh
    - description: Setting up Node
      command: setup/node.sh
    - description: Setting up Haxe
      command: setup/haxe.sh
    - description: Downloading fonts
      command: setup/fonts.sh
